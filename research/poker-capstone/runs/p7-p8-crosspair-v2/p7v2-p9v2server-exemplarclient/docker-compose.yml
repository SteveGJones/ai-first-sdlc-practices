services:
  # P7-v2: Sonnet's freshly-rebuilt P9-v2 SERVER (own design, TypeScript/
  # Express, built fresh against the current complete HARNESS-CONTRACT.md
  # including CORS) paired with the exemplar's own known-good CLIENT.
  server:
    build: ../../sonnet-p9v2-2026-07-29/impl/server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  client:
    build: ./client
    ports:
      - "8081:80"
    depends_on:
      - server
