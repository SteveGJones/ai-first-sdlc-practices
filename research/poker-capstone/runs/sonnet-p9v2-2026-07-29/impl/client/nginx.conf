server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The client is a single-page app whose only "route" is the root URL
    # with query-string deep-links (?table=&seat=), per
    # docs/CLIENT-TEST-CONTRACT.md's URL contract — so any path just falls
    # back to index.html rather than needing per-route rewrites.
    location / {
        try_files $uri /index.html;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
