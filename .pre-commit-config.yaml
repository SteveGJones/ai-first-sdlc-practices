# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: pretty-format-json
        args: ['--autofix', '--no-sort-keys']
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # CRITICAL: Add Python syntax validation
      - id: check-ast
        name: Check Python AST (Syntax)
        description: 'Check whether Python files parse as valid python'
      - id: check-builtin-literals
        name: Check builtin type constructor use (Python)
      - id: debug-statements
        name: Debug statement (Python)

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.9

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=127', '--extend-ignore=E203,W503']
        # research/poker-capstone/runs/ holds VERBATIM model submissions kept
        # as assessment evidence — code written by the model under test, not
        # by us. An unused import in a model's answer is a finding ABOUT that
        # model (recorded in that run's results write-up); "fixing" it would
        # corrupt the artifact the assessment rests on, and runs must stay
        # byte-identical so a result can be re-verified later. The assessment
        # HARNESS (research/poker-capstone/harness/) is our code and is
        # deliberately NOT excluded. Set here rather than in setup.cfg because
        # pre-commit passes filenames explicitly, bypassing flake8's own
        # `exclude`.
        exclude: '^research/poker-capstone/runs/'

  - repo: local
    hooks:
      - id: check-tmp-usage
        name: Check /tmp/ usage in agents
        entry: python tools/validation/check-tmp-usage.py
        language: python
        pass_filenames: false
        files: '\.md$'

