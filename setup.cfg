[flake8]
max-line-length = 127
extend-ignore = E203,W503
# research/poker-capstone/runs/ holds VERBATIM model submissions captured as
# assessment evidence — code written by the model under test, not by us.
# Linting it is a category error: an unused import in a model's answer is a
# finding about that model, recorded in that run's results write-up, and
# "fixing" it would corrupt the artifact the assessment rests on. Runs must
# stay byte-identical to what the model produced so a result can be
# re-verified. The assessment HARNESS (research/poker-capstone/harness/) is
# our code and is deliberately NOT excluded.
# Note: pre-commit passes filenames explicitly, which bypasses this; the same
# exclusion is therefore also set on the flake8 hook in .pre-commit-config.yaml.
# The same byte-identical rule covers the other verbatim corpora: the
# poker-capstone deliberately broken variants, the model-council assessment
# stack (items and expected outputs are fixtures, some defective on purpose),
# and the sdlc-bundles research outputs.
exclude = .git,__pycache__,research/poker-capstone/runs,research/poker-capstone/broken-variants,plugins/sdlc-model-council/assessment,research/sdlc-bundles/outputs
