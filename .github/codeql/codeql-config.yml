name: "AI-First SDLC CodeQL config"

# Exclude deliberately-buggy assessment fixtures from CodeQL scanning.
#
# The sdlc-model-council plugin ships an assessment problem stack under
# plugins/*/assessment/ — ORIGINAL code carrying PLANTED defects (mutable
# default arguments, off-by-one loops, dict-mutation-during-iteration, etc.).
# These are the exact bugs models are graded on finding in the code-review
# dimension; they are test content, never shipped application code. CodeQL
# correctly flags them (e.g. py/modification-of-default-value), but that is a
# false positive on intentional fixtures — the same reason the repo's
# technical-debt scanner skips plugins/. Scanning of all real application and
# tooling code is unaffected.
# Same rationale, second assessment instrument (the poker capstone, #237):
#
#   research/poker-capstone/runs/** — VERBATIM model submissions captured as
#   assessment evidence. This is code written by the model under test, not by
#   us, and some of it is defective ON PURPOSE as a recorded result — e.g.
#   runs/haiku-p5-*/ is the implementation whose bug we graded as that model's
#   P5 FAIL. "Fixing" a CodeQL alert here would corrupt the artifact the
#   assessment rests on; runs must stay byte-identical so a result can be
#   re-verified later. (CodeQL is also wrong on at least one of these:
#   py/non-iterable-in-for-loop on `for suit in Suit` where Suit is a
#   str/Enum, which is iterable.)
#
#   research/poker-capstone/broken-variants/** — exemplar copies with a single
#   deliberately-injected bug each, whose whole purpose is to prove the harness
#   fails on the SPECIFIC injected defect rather than silently.
#
# The assessment HARNESS (research/poker-capstone/harness/) and the EXEMPLAR
# reference implementation are our own code and are deliberately NOT excluded.
paths-ignore:
  - "plugins/*/assessment/**"
  - "research/poker-capstone/runs/**"
  - "research/poker-capstone/broken-variants/**"
